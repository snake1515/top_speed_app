{# Wordmark MOTO SPEED con la estela de velocidad del logo. Usa la fuente Orbitron. #}
{% set mid = mid|default('m') %}
<svg class="marca" viewBox="0 0 700 150" role="img" aria-label="{{ cfg.nombre }}">
<defs>
<linearGradient id="{{ mid }}tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFDC66"/><stop offset="0.5" stop-color="#FFC400"/><stop offset="1" stop-color="#735800"/></linearGradient>
<linearGradient id="{{ mid }}tr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFC400" stop-opacity="0"/><stop offset="1" stop-color="#FFDC66" stop-opacity="0.95"/></linearGradient>
<pattern id="{{ mid }}ck" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#0B0A07"/><rect width="6" height="6" fill="#F4F4F2"/><rect x="6" y="6" width="6" height="6" fill="#F4F4F2"/></pattern>
<linearGradient id="{{ mid }}fg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient>
<mask id="{{ mid }}fd"><rect x="0" y="0" width="100" height="150" fill="url(#{{ mid }}fg)"/></mask>
<filter id="{{ mid }}bl" x="-0.2" y="-0.2" width="1.4" height="1.4"><feGaussianBlur stdDeviation="3 0"/></filter>
</defs>
<rect x="0" y="40" width="108" height="7" rx="3.5" fill="url(#{{ mid }}tr)"/>
<rect x="4" y="54" width="94" height="48" fill="url(#{{ mid }}ck)" mask="url(#{{ mid }}fd)"/>
<rect x="4" y="105" width="88" height="3" fill="#E8243C" mask="url(#{{ mid }}fd)"/>
<rect x="10" y="114" width="76" height="7" rx="3.5" fill="url(#{{ mid }}tr)"/>
<g transform="skewX(-14) translate(30 0)" font-family="Orbitron, 'Barlow Condensed', sans-serif" font-weight="900" font-size="104" text-anchor="middle">
<text x="326" y="122" textLength="540" lengthAdjust="spacingAndGlyphs" fill="#FFC400" opacity="0.3" filter="url(#{{ mid }}bl)">{{ cfg.nombre|upper }}</text>
<text x="374" y="128" textLength="540" lengthAdjust="spacingAndGlyphs" fill="#E8243C">{{ cfg.nombre|upper }}</text>
<text x="370" y="122" textLength="540" lengthAdjust="spacingAndGlyphs" fill="#735800" stroke="#F4F4F2" stroke-width="5" stroke-linejoin="round">{{ cfg.nombre|upper }}</text>
<text x="370" y="122" textLength="540" lengthAdjust="spacingAndGlyphs" fill="url(#{{ mid }}tg)">{{ cfg.nombre|upper }}</text>
</g>
</svg>
